name: start app

on:
  push:
    branches: [test-branch, master]
env:
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  ORDER_DB_NAME: ${{ secrets.ORDER_DB_NAME }}
  IMAGE_NAME: order-service
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/order-service
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code check
        uses: actions/checkout@v4
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create micro-net network
        run: docker network create micro-net || true

      - name: Start DB & Eureka
        run: |
          docker compose up -d db eureka-server
          sleep 10

      - name: Run tests in container
        run: docker compose run --rm app \
          ./gradlew clean build --no-daemon
  build-and-push-image:
    name: Building Docker image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Code check
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}